# Opt-in AI code review on PRs (cold-context reviewer).
#
# Why: the in-repo review layers run in-session — the same context (and the
# same blind spots) as the authoring session. This adds an independent
# reviewer with no shared context at the PR boundary, before merge.
#
# Cost posture: this workflow spends Anthropic API tokens. It is OPT-IN — it
# skips cleanly until the ANTHROPIC_API_KEY repository secret is set — and is
# triggered only on PR open / ready-for-review (not every push), with
# concurrency-cancel so a superseded review never bills twice.
name: Claude Review

on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [main]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-secrets:
    name: api key present?
    runs-on: ubuntu-latest
    outputs:
      has-key: ${{ steps.check.outputs.has-key }}
    steps:
      - id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "has-key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not configured — Claude review skipped (opt-in)."
          fi

  review:
    name: claude code review
    needs: check-secrets
    if: needs.check-secrets.outputs.has-key == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request as an independent, cold-context reviewer.
            Read AGENTS.md first — enforce its Key Invariants (edge gate never
            imports a DB client, permissions vs flags stay separate, audit
            events on security-sensitive mutations, no toLocale* in
            components, no native browser dialogs, server actions re-checking
            session + permissions). Focus on real bugs, security issues, and
            invariant violations over style. Post concise inline comments only
            where a change is warranted, plus one short summary comment with a
            severity-ordered list.
          claude_args: "--max-turns 30"
