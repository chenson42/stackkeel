# Deploys docs-site to GitHub Pages. Canonical-repo-guarded: forks that keep
# docs-site update the repository guard (a registered identity file) during
# personalization, along with site/base in docs-site/astro.config.mjs.
name: docs

on:
  push:
    branches: [main]
    paths: ["docs-site/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'chenson42/stackkeel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter docs-site build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist
  deploy:
    if: github.repository == 'chenson42/stackkeel'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
